
name: Arknights CN News Bot

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      send_test:
        description: 'Send a test Discord notification'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: arknights-cn-news
  cancel-in-progress: false

jobs:
  check-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: arknights-cn-discord-bot/requirements.txt

      - name: Install dependencies
        run: pip install -r arknights-cn-discord-bot/requirements.txt

      - name: Check Arknights CN news
        working-directory: arknights-cn-discord-bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SEND_TEST: ${{ inputs.send_test }}
        run: |
          if [ "$SEND_TEST" = "true" ]; then
            python bot.py --test
          else
            python bot.py
          fi

      - name: Save seen news
        if: success() && inputs.send_test != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arknights-cn-discord-bot/state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update tracked Arknights news [skip ci]"
            git push
          fi
